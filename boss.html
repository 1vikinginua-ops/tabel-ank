<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кабинет ANK">
<meta name="theme-color" content="#0b111c">
<meta name="robots" content="noindex">
<title>Кабинет руководителя · ANK</title>
<link rel="manifest" href="boss.webmanifest">
<link rel="apple-touch-icon" href="boss-icon.png">
<link rel="icon" href="boss-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f2f4f8;--surface:#fff;--surface2:#f6f8fb;--ink:#101828;--muted:#667085;--line:#e4e7ec;--brand:#2563eb;--go:#16a34a;--stop:#ea580c;--warn:#d97706;--chip:#eef2f7;--shadow:0 1px 2px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.06);--font:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b111c;--surface:#141c2a;--surface2:#1a2434;--ink:#eef2f8;--muted:#8d9ab0;--line:#243044;--brand:#5b8cff;--go:#22c55e;--stop:#f97316;--warn:#f59e0b;--chip:#1c2738;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b111c;--surface:#141c2a;--surface2:#1a2434;--ink:#eef2f8;--muted:#8d9ab0;--line:#243044;--brand:#5b8cff;--go:#22c55e;--stop:#f97316;--warn:#f59e0b;--chip:#1c2738;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
html{background:var(--bg)}
body{background:radial-gradient(120% 50% at 50% -10%,color-mix(in srgb,var(--brand) 22%,transparent),transparent 60%) no-repeat,var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;overscroll-behavior-y:none;letter-spacing:-.005em}
button{font-family:inherit}
.app{max-width:760px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:13px;background:#fff url(boss-icon.png) center/cover no-repeat;box-shadow:var(--shadow);flex:none}
.top h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}@media (max-width:370px){.top h1{font-size:17px}.top .sub{font-size:12px}}
.top .sub{font-size:13px;color:var(--muted)}
.top .grow{flex:1;min-width:0}
.icon{width:44px;height:44px;border-radius:14px;border:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;transition:transform .12s;flex:none}
.icon:active{transform:scale(.92)}.icon svg{width:22px;height:22px}
.icon.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.period{display:flex;flex-direction:column;gap:8px;position:sticky;top:0;z-index:5;padding:6px 0 4px;background:linear-gradient(var(--bg) 70%,transparent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:none;color:var(--muted);font:600 14px var(--font);min-height:38px;border-radius:10px;transition:background .2s,color .2s,transform .1s}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}.seg button:active{transform:scale(.96)}
.nav{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:8px}
.nav button{min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;cursor:pointer}
.nav .t{text-align:center;font-weight:800;font-size:18px;letter-spacing:-.01em;text-transform:capitalize}
.nav .t small{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:none}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0;animation:in .34s cubic-bezier(.2,.8,.2,1) both}
main>.card:nth-child(2){animation-delay:.04s}main>.card:nth-child(3){animation-delay:.08s}main>.card:nth-child(4){animation-delay:.12s}main>.card:nth-child(n+5){animation-delay:.15s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand)}
.hint{font-size:13px;color:var(--muted);margin:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface2);border-radius:14px;padding:12px 8px;text-align:center}
.kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:11.5px;color:var(--muted);font-weight:600;display:block;margin-top:3px}
.kpi.warn b{color:var(--stop)}.kpi.ok b{color:var(--go)}
.kpis.two{grid-template-columns:repeat(2,1fr)}
@media (max-width:360px){.kpis{grid-template-columns:repeat(2,1fr)}}
.worker{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:start;padding:12px;border-radius:16px;background:var(--surface2);cursor:pointer;transition:transform .12s,background .2s;text-align:left;border:0;width:100%;color:inherit;font:inherit}
.worker:active{transform:scale(.985)}
.ava{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:16px;letter-spacing:-.02em;position:relative}
.ava i{position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-radius:50%;background:var(--muted);border:2px solid var(--surface2)}
.ava i.on{background:var(--go);animation:pulse 1.8s infinite}.ava i.done{background:var(--brand)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--go) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.worker .n{font-weight:800;font-size:16px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.worker .s{font-size:12.5px;color:var(--muted);line-height:1.35}
.worker .h{text-align:right}.worker .h b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}.worker .h span{font-size:11px;color:var(--muted);font-weight:600}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;color:var(--muted)}
.chip.warn{background:color-mix(in srgb,var(--stop) 14%,var(--surface));color:var(--stop)}.chip.ok{background:color-mix(in srgb,var(--go) 14%,var(--surface));color:var(--go)}.chip.info{background:color-mix(in srgb,var(--brand) 14%,var(--surface));color:var(--brand)}
.spark{display:flex;align-items:flex-end;gap:2px;height:22px;margin-top:6px}
.spark i{flex:1;background:var(--brand);border-radius:2px;min-height:2px;opacity:.85;transform-origin:bottom;animation:grow .5s cubic-bezier(.2,.8,.2,1) both}
.spark i.over{background:var(--stop)}.spark i.none{background:var(--line);opacity:.6}
@keyframes grow{from{transform:scaleY(0)}}
.chart{width:100%;height:auto;display:block}
.chart .b{fill:var(--brand);transform-origin:bottom;animation:grow .55s cubic-bezier(.2,.8,.2,1) both}.chart .b.over{fill:var(--stop)}.chart .b.none{fill:var(--line)}
.chart .l{fill:var(--muted);font:600 10px var(--font)}.chart .v{fill:var(--ink);font:700 10px var(--font)}.chart .norm{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1}
.hbar{display:flex;flex-direction:column;gap:10px}
.hb .t{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}.hb .t span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .t b{font-variant-numeric:tabular-nums}
.hb .bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}.hb .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),color-mix(in srgb,var(--brand) 60%,var(--go)));transform-origin:left;animation:growx .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(0)}}
.btn{min-height:46px;padding:10px 16px;border-radius:14px;font:650 15px var(--font);background:var(--surface2);border:1px solid var(--line);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:transform .12s;text-align:center;line-height:1.2}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.danger{color:var(--stop)}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.5}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
input,select{font:16px var(--font);color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;min-height:48px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.row{display:grid;grid-template-columns:1fr auto;gap:8px}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.day:first-child{border-top:0}
.day .d b{display:block;font-size:16px;font-weight:800}.day .d span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.day .w{font-weight:600;font-size:14px;word-break:break-word}.day .p{font-size:12.5px;color:var(--muted);margin-top:2px}.day .p a{color:var(--brand);font-weight:600;text-decoration:none}
.day .h{text-align:right;max-width:122px}.day .h b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}.day .h span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.flag{background:color-mix(in srgb,var(--stop) 7%,transparent);margin:0 -16px;padding:12px 16px;border-radius:12px}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--stop) 12%,var(--surface));font-size:14px;line-height:1.35}
.alert.ok{background:color-mix(in srgb,var(--go) 12%,var(--surface))}.alert .i{flex:none;font-size:18px;line-height:1.2}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--chip);width:max-content}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}.status.on i{background:var(--go);animation:pulse 1.8s infinite}.status.done i{background:var(--brand)}
.sk{position:relative;overflow:hidden;background:var(--surface2);border-radius:12px;min-height:18px}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink) 7%,transparent),transparent);animation:sh 1.3s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.empty{text-align:center;color:var(--muted);padding:12px 0}
.big-ava{width:64px;height:64px;font-size:22px}
.head{display:flex;align-items:center;gap:14px}
.head h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.head .e{font-size:13px;color:var(--muted);word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:20;box-shadow:var(--shadow);text-align:center;max-width:calc(100vw - 32px);animation:in .25s both}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .box{background:var(--surface);border-radius:22px;padding:18px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;animation:in .3s cubic-bezier(.2,.8,.2,1) both}
.sheet h3{margin:0;font-size:18px}
.tabs2{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{flex:none;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font:600 13px var(--font);padding:8px 12px;border-radius:999px}
.tabs2 button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.stale{font-size:12px;color:var(--warn);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.linkrow{display:flex;gap:8px;flex-wrap:wrap}
.linkrow a{font-size:12px;font-weight:700;color:var(--brand);text-decoration:none;background:color-mix(in srgb,var(--brand) 10%,var(--surface));padding:4px 9px;border-radius:999px}
footer{text-align:center;font-size:12px;color:var(--muted);padding-top:6px}
@media print{.period,.icon,.btns,footer,.nav button{display:none!important}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}body{background:#fff}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo" aria-hidden="true"></div>
    <div class="grow"><h1 id="title">Кабинет руководителя</h1><div class="sub" id="subtitle">Ingeniería y reformas ANK</div></div>
    <button class="icon" id="settings" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button class="icon" id="refresh" aria-label="Обновить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
  </header>
  <nav class="period" id="period">
    <div class="seg" id="mode"><button type="button" data-m="week">Неделя</button><button type="button" data-m="month">Месяц</button><button type="button" data-m="quarter">Квартал</button></div>
    <div class="nav"><button type="button" id="prev" aria-label="Раньше">‹</button><div class="t" id="ptitle">—</div><button type="button" id="next" aria-label="Позже">›</button></div>
  </nav>
  <main id="view"></main>
  <footer><a href="./" style="color:var(--brand);font-weight:700;text-decoration:none">← Открыть Табель</a> · данные обновляются из приложений рабочих</footer>
</div>
<script src="boss.js"></script>
</body>
</html>
