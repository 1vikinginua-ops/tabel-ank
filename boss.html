<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#eef1f6;--surface:#fff;--surface2:#f4f6fa;--ink:#101828;--muted:#667085;--line:#e4e7ec;--brand:#2563eb;--brand2:#7c3aed;--accent:#f97316;--go:#16a34a;--stop:#ea580c;--warn:#d97706;--chip:#eef2f7;--shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);--font:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1a;--surface:#131a28;--surface2:#1a2334;--ink:#eef2f8;--muted:#8d9ab0;--line:#243044;--brand:#5b8cff;--brand2:#a78bfa;--accent:#fb923c;--go:#22c55e;--stop:#f97316;--warn:#f59e0b;--chip:#1c2738;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0f1a;--surface:#131a28;--surface2:#1a2334;--ink:#eef2f8;--muted:#8d9ab0;--line:#243044;--brand:#5b8cff;--brand2:#a78bfa;--accent:#fb923c;--go:#22c55e;--stop:#f97316;--warn:#f59e0b;--chip:#1c2738;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
html{background:var(--bg)}
body{background:radial-gradient(900px 520px at -5% -10%,color-mix(in srgb,var(--brand) 26%,transparent),transparent 65%),radial-gradient(700px 420px at 105% 0%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;overscroll-behavior-y:none;letter-spacing:-.005em;font-feature-settings:"ss01","cv11"}
button{font-family:inherit;cursor:pointer}
a{color:var(--brand)}
.app{max-width:760px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.topbar{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:13px;background:#fff url(boss-icon.png) center/cover no-repeat;box-shadow:var(--shadow);flex:none}
.topbar h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.topbar .sub{font-size:13px;color:var(--muted)}
.topbar .grow{flex:1;min-width:0}
.icon{width:44px;height:44px;border-radius:14px;border:1px solid color-mix(in srgb,var(--line) 70%,transparent);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .12s,background .2s;flex:none}
.icon:active{transform:scale(.92)}.icon svg{width:22px;height:22px}
.icon.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.period{display:flex;flex-direction:column;gap:8px;position:sticky;top:0;z-index:5;padding:6px 0 4px;background:linear-gradient(var(--bg) 70%,transparent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:none;color:var(--muted);font:600 14px var(--font);min-height:38px;border-radius:10px;transition:background .2s,color .2s,transform .1s}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}.seg button:active{transform:scale(.96)}
.nav{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:8px}
.nav button{min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;transition:transform .12s,background .2s}
.nav button:active{transform:scale(.94)}
.nav .t{text-align:center;font-weight:800;font-size:18px;letter-spacing:-.01em;text-transform:capitalize;cursor:pointer}
.nav .t small{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:none}
.menu{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.menu::-webkit-scrollbar{display:none}
.menu button{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:650 14px var(--font);padding:9px 14px;border-radius:999px;transition:background .2s,color .2s,transform .12s,border-color .2s}
.menu button svg{width:18px;height:18px}
.menu button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 32%,transparent)}
.menu button:active{transform:scale(.96)}
.side-list{display:none}
.card{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0;animation:in .34s cubic-bezier(.2,.8,.2,1) both;position:relative}
main>.card:nth-child(2){animation-delay:.04s}main>.card:nth-child(3){animation-delay:.08s}main>.card:nth-child(4){animation-delay:.12s}main>.card:nth-child(n+5){animation-delay:.15s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card.glow{background:linear-gradient(150deg,color-mix(in srgb,var(--brand) 14%,var(--surface)),var(--surface) 55%)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand)}
.eyebrow .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--brand);cursor:pointer;background:none;border:0;font-size:12px;padding:0}
.hint{font-size:13px;color:var(--muted);margin:0;line-height:1.45}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface2);border-radius:14px;padding:12px 8px;text-align:center;position:relative;overflow:hidden;transition:transform .2s}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--brand);opacity:.0;transition:opacity .2s}
.kpi b{display:block;white-space:nowrap;font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:11.5px;color:var(--muted);font-weight:600;display:block;margin-top:3px}
.kpi.warn b{color:var(--stop)}.kpi.ok b{color:var(--go)}.kpi.brand b{color:var(--brand)}
.kpi.warn::before{background:var(--stop);opacity:1}.kpi.ok::before{background:var(--go);opacity:1}.kpi.brand::before{opacity:1}
.kpis.two{grid-template-columns:repeat(2,1fr)}
@media (max-width:360px){.kpis{grid-template-columns:repeat(2,1fr)}}
.worker{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:start;padding:12px;border-radius:16px;background:var(--surface2);cursor:pointer;transition:transform .12s,background .2s,box-shadow .2s;text-align:left;border:1px solid transparent;width:100%;color:inherit;font:inherit}
.worker:active{transform:scale(.985)}
.worker.active{border-color:color-mix(in srgb,var(--brand) 50%,transparent);background:color-mix(in srgb,var(--brand) 9%,var(--surface2))}
.ava{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:16px;letter-spacing:-.02em;position:relative;flex:none}
.ava i{position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-radius:50%;background:var(--muted);border:2px solid var(--surface2)}
.ava i.on{background:var(--go);animation:pulse 1.8s infinite}.ava i.done{background:var(--brand)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--go) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.worker .n{font-weight:800;font-size:16px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.worker .s{font-size:12.5px;color:var(--muted);line-height:1.35}
.worker .h{text-align:right}.worker .h b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}.worker .h span{font-size:11px;color:var(--muted);font-weight:600}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;color:var(--muted)}
.chip.warn{background:color-mix(in srgb,var(--stop) 14%,var(--surface));color:var(--stop)}.chip.ok{background:color-mix(in srgb,var(--go) 14%,var(--surface));color:var(--go)}.chip.info{background:color-mix(in srgb,var(--brand) 14%,var(--surface));color:var(--brand)}
.spark{display:flex;align-items:flex-end;gap:2px;height:22px;margin-top:6px}
.spark i{flex:1;background:var(--brand);border-radius:2px;min-height:2px;opacity:.85;transform-origin:bottom;animation:grow .5s cubic-bezier(.2,.8,.2,1) both}
.spark i.over{background:var(--stop)}.spark i.none{background:var(--line);opacity:.6}
@keyframes grow{from{transform:scaleY(0)}}
.chart{width:100%;height:auto;display:block}
.chart .b{fill:var(--brand);transform-origin:bottom;animation:grow .55s cubic-bezier(.2,.8,.2,1) both}.chart .b.over{fill:var(--stop)}.chart .b.none{fill:var(--line)}
.chart .l{fill:var(--muted);font:600 10px var(--font)}.chart .v{fill:var(--ink);font:700 10px var(--font)}.chart .norm{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1}
.hbar{display:flex;flex-direction:column;gap:10px}
.hb{cursor:default}.hb.link{cursor:pointer}
.hb .t{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}.hb .t span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .t b{font-variant-numeric:tabular-nums;white-space:nowrap}
.hb .bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}.hb .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),color-mix(in srgb,var(--brand) 55%,var(--brand2)));transform-origin:left;animation:growx .6s cubic-bezier(.2,.8,.2,1) both}
.hb .bar i.o{background:linear-gradient(90deg,var(--accent),var(--stop))}
@keyframes growx{from{transform:scaleX(0)}}
.btn{min-height:46px;padding:10px 16px;border-radius:14px;font:650 15px var(--font);background:var(--surface2);border:1px solid var(--line);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:transform .12s,background .2s,box-shadow .2s;text-align:center;line-height:1.2}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 30%,transparent)}.btn.danger{color:var(--stop)}.btn.small{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.5}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
input,select,textarea{font:16px var(--font);color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;min-height:48px;min-width:0;transition:border-color .15s,box-shadow .15s}
textarea{min-height:76px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.row{display:grid;grid-template-columns:1fr auto;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.day:first-child{border-top:0}
.day .d b{display:block;font-size:16px;font-weight:800}.day .d span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.day .w{font-weight:600;font-size:14px;word-break:break-word}.day .p{font-size:12.5px;color:var(--muted);margin-top:2px}.day .p a{color:var(--brand);font-weight:600;text-decoration:none}
.day .h{text-align:right;max-width:122px}.day .h b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}.day .h span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.flag{background:color-mix(in srgb,var(--stop) 7%,transparent);margin:0 -16px;padding:12px 16px;border-radius:12px}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--stop) 12%,var(--surface));font-size:14px;line-height:1.35}
.alert.ok{background:color-mix(in srgb,var(--go) 12%,var(--surface))}.alert.info{background:color-mix(in srgb,var(--brand) 10%,var(--surface))}.alert .i{flex:none;font-size:18px;line-height:1.2}
.alert.link{cursor:pointer}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--chip);width:max-content;max-width:100%}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}.status.on i{background:var(--go);animation:pulse 1.8s infinite}.status.done i{background:var(--brand)}
.sk{position:relative;overflow:hidden;background:var(--surface2);border-radius:12px;min-height:18px}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink) 7%,transparent),transparent);animation:sh 1.3s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.empty{text-align:center;color:var(--muted);padding:12px 0}
.big-ava{width:64px;height:64px;font-size:22px}
.head{display:flex;align-items:center;gap:14px}
.head h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.head .e{font-size:13px;color:var(--muted);word-break:break-all}
.ring{position:relative;width:72px;height:72px;flex:none;margin-left:auto}
.ring svg{width:72px;height:72px;transform:rotate(-90deg)}
.ring .trk{stroke:var(--surface2);fill:none;stroke-width:8}
.ring .val{fill:none;stroke-width:8;stroke-linecap:round;stroke:url(#rg);transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .mid b{font-size:15px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}.ring .mid span{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:20;box-shadow:var(--shadow);text-align:center;max-width:calc(100vw - 32px);animation:in .25s both}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .box{background:var(--surface);border-radius:22px;padding:18px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;animation:in .3s cubic-bezier(.2,.8,.2,1) both;max-height:92vh;overflow:auto}
.sheet h3{margin:0;font-size:18px}
.stale{font-size:12px;color:var(--warn);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.linkrow{display:flex;gap:8px;flex-wrap:wrap}
.linkrow a{font-size:12px;font-weight:700;color:var(--brand);text-decoration:none;background:color-mix(in srgb,var(--brand) 10%,var(--surface));padding:4px 9px;border-radius:999px}
.note{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 12px;border-radius:14px;background:var(--surface2);font-size:14px;line-height:1.4;align-items:start}
.note small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:2px}
.note .x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:8px;cursor:pointer}
.note .x:hover{background:var(--chip);color:var(--stop)}
.note.pin{background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.pay{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;align-items:baseline}
.pay b{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}.pay .tot{font-size:18px;font-weight:800;padding-top:6px;border-top:1px solid var(--line)}.pay .tot b{font-size:20px}.pay .neg b{color:var(--stop)}.pay .pos b{color:var(--go)}
.adv{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.adv:first-child{border-top:0}.adv .s{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.adv .n{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.adv .d{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.link{cursor:pointer;transition:background .15s}.tbl tr.link:hover{background:var(--surface2)}
.tbl tr.tot td{font-weight:800;border-top:2px solid var(--line);border-bottom:0}
.tbl .who{display:flex;align-items:center;gap:10px;font-weight:700}.tbl .who .ava{width:32px;height:32px;font-size:12px}
.wrapx{overflow-x:auto;margin:0 -16px;padding:0 16px}
.search{position:relative}.search input{padding-left:38px;min-height:44px;border-radius:12px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.onsite{display:flex;flex-direction:column;gap:8px}
.onsite .w{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:color-mix(in srgb,var(--go) 9%,var(--surface2));cursor:pointer}
.onsite .w .ava{width:36px;height:36px;font-size:13px}.onsite .w b{display:block;font-size:14px}.onsite .w span{font-size:12px;color:var(--muted)}.onsite .w .t{font-weight:800;font-variant-numeric:tabular-nums;color:var(--go)}
footer{text-align:center;font-size:12px;color:var(--muted);padding-top:6px}
.only-d{display:none}
kbd{font:600 11px var(--font);background:var(--chip);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--muted)}
::view-transition-old(root){animation:vt-out .16s ease both}::view-transition-new(root){animation:vt-in .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes vt-out{to{opacity:0;transform:translateY(-6px)}}@keyframes vt-in{from{opacity:0;transform:translateY(10px)}}
html[data-vt=side]::view-transition-old(root){animation-name:vt-out-s}html[data-vt=side]::view-transition-new(root){animation-name:vt-in-s}
@keyframes vt-out-s{to{opacity:0;transform:translateX(-10px)}}@keyframes vt-in-s{from{opacity:0;transform:translateX(16px)}}
.side{view-transition-name:side}::view-transition-group(side){animation-duration:0s}
/* ---------- desktop ---------- */
@media (min-width:980px){
  .app{max-width:1300px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:0 28px;align-items:start;padding-top:22px;padding-bottom:40px}
  .side{position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding:0 0 20px;gap:14px;scrollbar-width:thin}
  .period{position:static;background:none;padding:0}
  .topbar h1{font-size:17px;overflow-wrap:normal}
  .menu{flex-direction:column;gap:4px;overflow:visible;background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:18px;padding:8px;box-shadow:var(--shadow)}
  .menu button{width:100%;justify-content:flex-start;border:0;background:none;border-radius:12px;padding:11px 12px;font-size:15px}
  .menu button:hover{background:var(--surface2);color:var(--ink)}
  .menu button[aria-pressed=true]{background:color-mix(in srgb,var(--brand) 12%,var(--surface));color:var(--brand);box-shadow:none}
  .side-list{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:18px;padding:10px;box-shadow:var(--shadow)}
  .side-list .eyebrow{padding:4px 4px 2px}
  .side-list .worker{grid-template-columns:38px 1fr auto;padding:9px 10px;border-radius:12px;background:transparent;gap:10px}
  .side-list .worker:hover{background:var(--surface2)}
  .side-list .worker.active{background:color-mix(in srgb,var(--brand) 11%,var(--surface))}
  .side-list .ava{width:38px;height:38px;font-size:13px}.side-list .ava i{width:12px;height:12px}
  .side-list .worker .n{font-size:14px}.side-list .worker .s{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.side-list .worker .h b{font-size:15px}.side-list .worker .h span{display:none}
  main{display:flex;flex-direction:column;gap:16px}
  .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}.col{display:flex;flex-direction:column;gap:16px;min-width:0}
  .only-m{display:none!important}.only-d{display:block}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(136px,1fr))}
  .kpi b{font-size:24px}
  .card{padding:18px 20px}
  .day{grid-template-columns:56px 1fr auto}
  .head h2{font-size:26px}
  footer{grid-column:1/-1}
  .sheet{align-items:center}
  .wrapx{margin:0;padding:0}
}
@media (hover:hover){
  .worker:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .btn:hover{filter:brightness(1.05);box-shadow:var(--shadow)}
  .icon:hover{background:var(--surface2)}
  .nav button:hover{background:var(--surface2)}
  .kpi:hover{transform:translateY(-2px)}
  .alert.link:hover{filter:brightness(1.04)}
  .hb.link:hover .t span{color:var(--brand)}
}
@media print{.side,.period,.menu,.topbar,.icon,.btns,footer,.nav button,.side-list,.search,.btn{display:none!important}.app{display:block;max-width:none}main{display:block}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;margin-bottom:12px}body{background:#fff}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
